<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sensor Detective: Teacher page</title>
<style>
:root{--bg:#f3f5f0;--card:#fff;--ink:#1d2a26;--mute:#5d6b66;--line:#d3dad4;--accent:#1f7a63;--amber:#b87a00;--bad:#b3402f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1a2420;--ink:#e6efe9;--mute:#9db0a7;--line:#2e3d37;--accent:#4cc9a1;--amber:#e8b84a;--bad:#ef8a78}}
:root[data-theme="dark"]{--bg:#121815;--card:#1a2420;--ink:#e6efe9;--mute:#9db0a7;--line:#2e3d37;--accent:#4cc9a1;--amber:#e8b84a;--bad:#ef8a78}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:18px 16px 48px}
h1{font:700 2rem/1.15 Georgia,"Times New Roman",serif;margin:6px 0}
.lead{color:var(--mute);max-width:64ch}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
input,textarea{width:100%;font:13px ui-monospace,Menlo,Consolas,monospace;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:40px}
button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
summary{cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:.9rem;display:block;overflow-x:auto;margin-top:8px}
td,th{padding:4px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.bad{color:var(--bad)}.mute{color:var(--mute);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>Teacher page</h1>
<p class="lead">Scores are sent through the Google Form and saved in its linked Sheet. This page reads the shared Sheet and refreshes every 15 seconds.</p>
<div class="box"><label for="u" class="mute">Google Sheet link</label>
<input id="u" value="https://docs.google.com/spreadsheets/d/1DP2AWRSeM8XnG-FMwu-p59xRa154xUJwQ5a0JctHWW0/edit?usp=sharing" aria-label="Google Sheet link">
<div class="row"><button class="pri" id="con">Connect</button><button id="dis">Disconnect</button></div>
<p class="mute" id="stat"></p></div>
<details class="box"><summary>No Sheet link? Paste result codes by hand</summary>
<textarea id="in" rows="5" placeholder="One result code per line"></textarea><div class="row"><button id="man">Show results</button></div></details>
<div id="out"></div>
</main>
<script>
var N={ldr:"LDR (light sensor)",ultra:"HC-SR04 (ultrasonic distance)",pir:"PIR (motion sensor)",soil:"Soil moisture sensor",dht:"DHT11 (temperature and humidity)",lm35:"LM35 temperature sensor",mq2:"MQ-2 smoke and gas sensor",mic:"Sound sensor (analog microphone)",tilt:"Tilt switch",fsr:"Force sensor (FSR)",flex:"Flex sensor",pot:"Potentiometer",reed:"Reed switch",ttp:"Touch sensor (TTP223)",rain:"Rain drop sensor"};
var $=function(i){return document.getElementById(i)},op={},timer=null,url="";
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function dec(t){return JSON.parse(decodeURIComponent(escape(atob(t.replace(/\s+/g,"")))))}
function parse(cells){var teams={},bad=0;
cells.forEach(function(c,n){c=c.trim().replace(/^"|"$/g,"");if(!c||c.toLowerCase()==="result")return;try{var o=dec(c);if(!o||typeof o.n!=="string")throw 0;if(o.submittedAt==null)return;teams[o.i||(o.n+"|"+(o.m||""))]=o}catch(e){bad++}});
return{teams:teams,bad:bad}}
function render(r,note){
var t=Object.keys(r.teams).map(function(k){var x=r.teams[k];x.k=k;x.wrongCount=x.wrongCount==null?Object.keys(x.b||{}).reduce(function(n,q){return n+((x.b[q].wrong||[]).length)},0):(+x.wrongCount||0);return x}).sort(function(a,b){return(+b.s||0)-(+a.s||0)});
var top=t.length?(+t[0].s||0):-1,winners=t.filter(function(x){return(+x.s||0)===top});
var h=t.length?'<div class="box"><h2>&#127942; '+(winners.length>1?'Joint leaders: ':'Current leader: ')+winners.map(function(x){return esc(x.n)}).join(', ')+' &mdash; '+Math.max(0,top)+' pts</h2></div><div class="box"><h2>Team scoreboard</h2><table><tr><th>Rank</th><th>Team</th><th>Submitted</th><th>Wrong guesses</th><th>Score</th><th>Result</th></tr>': '<div class="box">No teams have submitted yet.</div>';
t.forEach(function(x,i){var dt=new Date(+(x.submittedAt||x.t||0)),stamp=isNaN(dt.getTime())?'N/A':dt.toLocaleString(),winner=(+x.s||0)===top;
h+='<tr><td>'+(i+1)+'</td><td><b>'+esc(x.n)+'</b><br><small>'+esc(x.m||'')+'</small></td><td>'+esc(stamp)+'</td><td>'+(+x.wrongCount||0)+'</td><td><b>'+(+x.s||0)+' pts</b></td><td>'+(winner?'<b>WINNER</b>':'&mdash;')+'</td></tr>'});
if(t.length)h+='</table></div>';
t.forEach(function(x){var b=x.b||{},ks=Object.keys(b).sort(),sv=ks.filter(function(q){return b[q].solved}).length;
h+='<details class="box"><summary><b>'+esc(x.n)+'</b> &mdash; '+(+x.s||0)+' pts, '+(+x.wrongCount||0)+' wrong guesses, submitted '+esc(new Date(+(x.submittedAt||x.t||0)).toLocaleTimeString())+'</summary><table><tr><th>Box</th><th>Sensor</th><th>Result</th><th>Wrong guesses</th></tr>';
ks.forEach(function(q){var z=b[q];h+='<tr><td>'+q+'</td><td>'+esc(N[z.sensor]||z.sensor||"&mdash;")+'</td><td>'+(z.solved?"Solved +"+(+z.pts||0):z.failed?"Gave up":"Working")+'</td><td>'+esc((z.wrong||[]).join("; ")||"&mdash;")+'</td></tr>'});h+='</table></details>'});

$("out").innerHTML=h;$("out").querySelectorAll("details").forEach(function(d){d.addEventListener("toggle",function(){op[d.dataset.k]=d.open})});$("stat").textContent=note+(r.bad?" "+r.bad+" row(s) could not be read.":"")}
var sheetScript=null,sheetTimeout=null;
window.receiveSheet=function(data){clearTimeout(sheetTimeout);if(sheetScript){sheetScript.remove();sheetScript=null}if(!data||data.status!=="ok"||!data.table){$("stat").innerHTML='<span class="bad">Could not read this Sheet. Check that its link is shared with viewers.</span>';return}
var cols=data.table.cols||[],col=cols.findIndex(function(c){return String(c.label||"").toLowerCase()==="result"});if(col<0)col=1;
var cells=(data.table.rows||[]).map(function(row){var c=row.c&&row.c[col];return c&&c.v!=null?String(c.v):""});
render(parse(cells),"Connected. Updated at "+new Date().toLocaleTimeString()+".")};
function load(){if(!url)return;var m=url.match(/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);if(!m){$("stat").innerHTML='<span class="bad">Paste a Google Sheets link.</span>';return}
if(sheetScript)sheetScript.remove();clearTimeout(sheetTimeout);sheetScript=document.createElement("script");sheetScript.src="https://docs.google.com/spreadsheets/d/"+m[1]+"/gviz/tq?tqx=out:json;responseHandler:receiveSheet&t="+Date.now();sheetScript.onerror=function(){clearTimeout(sheetTimeout);$("stat").innerHTML='<span class="bad">Could not load the Sheet. Check that its link is shared with viewers.</span>';sheetScript.remove();sheetScript=null};document.head.appendChild(sheetScript);sheetTimeout=setTimeout(function(){if(sheetScript){sheetScript.remove();sheetScript=null;$("stat").innerHTML='<span class="bad">The Sheet did not respond. Check its sharing settings and try again.</span>'}},12000)}
function connect(){url=$("u").value.trim();if(!url)return;try{localStorage.setItem("sdurl",url)}catch(e){}clearInterval(timer);load();timer=setInterval(load,15000)}
$("con").addEventListener("click",connect);
$("dis").addEventListener("click",function(){clearInterval(timer);url="";$("u").value="";if(sheetScript){sheetScript.remove();sheetScript=null}clearTimeout(sheetTimeout);try{localStorage.removeItem("sdurl")}catch(e){}$("stat").textContent="Disconnected.";$("out").innerHTML=""});
$("man").addEventListener("click",function(){render(parse($("in").value.split("\n")),"Showing pasted codes.")});
try{var sv=localStorage.getItem("sdurl");if(sv){$("u").value=sv}connect()}catch(e){connect()}
</script>
</body>
</html>
